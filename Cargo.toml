[workspace]
resolver = "3"
# Everything except the Python binding. Building the engine must not
# require a Python interpreter — D16's third cost — so `cargo build` and
# `cargo test` skip `oq-py`, and CI builds it explicitly.
default-members = [
    "crates/oq-backtest",
    "crates/oq-book",
    "crates/oq-cli",
    "crates/oq-core",
    "crates/oq-data",
    "crates/oq-engine",
    "crates/oq-env",
    "crates/oq-examples",
    "crates/oq-features",
    "crates/oq-gateway",
    "crates/oq-hash",
    "crates/oq-ingest",
    "crates/oq-journal",
    "crates/oq-l2feed",
    "crates/oq-live",
    "crates/oq-margin",
    "crates/oq-parity",
    "crates/oq-risk",
    "crates/oq-sim",
    "crates/oq-stats",
    "crates/oq-strategy",
    "crates/oq-types",
]
members = [
    "crates/oq-backtest",
    "crates/oq-book",
    "crates/oq-cli",
    "crates/oq-core",
    "crates/oq-data",
    "crates/oq-engine",
    "crates/oq-env",
    "crates/oq-examples",
    "crates/oq-features",
    "crates/oq-hash",
    "crates/oq-journal",
    "crates/oq-ingest",
    "crates/oq-l2feed",
    "crates/oq-live",
    "crates/oq-margin",
    "crates/oq-parity",
    "crates/oq-py",
    "crates/oq-risk",
    "crates/oq-sim",
    "crates/oq-stats",
    "crates/oq-strategy",
    "crates/oq-types",
    "crates/oq-gateway",
]

[workspace.package]
# One version for the whole workspace: the crates are one release train,
# and a reader asking "what version is this" should get one answer.
# See docs/VERSIONING.md.
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/openquanter/openquanter"

# Internal dependencies are declared once here so a version bump is a
# single edit and cannot drift between crates.
[workspace.dependencies]
oq-book = { path = "crates/oq-book", version = "2.0.0-alpha.1" }
oq-backtest = { path = "crates/oq-backtest", version = "2.0.0-alpha.1" }
oq-cli = { path = "crates/oq-cli", version = "2.0.0-alpha.1" }
oq-core = { path = "crates/oq-core", version = "2.0.0-alpha.1" }
oq-data = { path = "crates/oq-data", version = "2.0.0-alpha.1" }
oq-engine = { path = "crates/oq-engine", version = "2.0.0-alpha.1" }
oq-env = { path = "crates/oq-env", version = "2.0.0-alpha.1" }
oq-features = { path = "crates/oq-features", version = "2.0.0-alpha.1" }
oq-gateway = { path = "crates/oq-gateway", version = "2.0.0-alpha.1" }
oq-hash = { path = "crates/oq-hash", version = "2.0.0-alpha.1" }
oq-journal = { path = "crates/oq-journal", version = "2.0.0-alpha.1" }
oq-ingest = { path = "crates/oq-ingest", version = "2.0.0-alpha.1" }
oq-l2feed = { path = "crates/oq-l2feed", version = "2.0.0-alpha.1" }
oq-live = { path = "crates/oq-live", version = "2.0.0-alpha.1" }
oq-margin = { path = "crates/oq-margin", version = "2.0.0-alpha.1" }
oq-parity = { path = "crates/oq-parity", version = "2.0.0-alpha.1" }
oq-py = { path = "crates/oq-py", version = "2.0.0-alpha.1" }
oq-risk = { path = "crates/oq-risk", version = "2.0.0-alpha.1" }
oq-sim = { path = "crates/oq-sim", version = "2.0.0-alpha.1" }
oq-stats = { path = "crates/oq-stats", version = "2.0.0-alpha.1" }
oq-strategy = { path = "crates/oq-strategy", version = "2.0.0-alpha.1" }
oq-types = { path = "crates/oq-types", version = "2.0.0-alpha.1" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# Debug info is what makes target/ enormous, and almost none of it is ours.
# Measured 2026-08-26: `cargo clean` removed 414,252 files / 17.7 GiB from a
# workspace of 45 members over 192 locked crates, with no [profile] set at all —
# so every dependency was carrying full DWARF, undeduplicated and unstripped.
#
# debug = 1 keeps line tables (backtraces still name file:line) and drops the
# type/variable detail a debugger would want. Stepping into a dependency is rare
# enough that paying for it on all 192 of them is the wrong trade, so those get
# none; our own crates keep line tables.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
