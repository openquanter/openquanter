[workspace]
resolver = "3"
members = [
    "crates/oq-backtest",
    "crates/oq-core",
    "crates/oq-data",
    "crates/oq-engine",
    "crates/oq-examples",
    "crates/oq-hash",
    "crates/oq-journal",
    "crates/oq-l2feed",
    "crates/oq-margin",
    "crates/oq-parity",
    "crates/oq-stats",
    "crates/oq-types",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/openquanter/openquanter"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
