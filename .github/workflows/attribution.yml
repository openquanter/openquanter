name: Attribution

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  attribution:
    name: Human attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check walks the commit range, so the full history of the
          # pull request branch is required.
          fetch-depth: 0

      - name: Check no commit credits an assistant
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            scripts/check-no-ai-attribution.sh "$BASE_SHA" "$HEAD_SHA"
          else
            scripts/check-no-ai-attribution.sh
          fi
