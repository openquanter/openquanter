name: Wheels

# Built on every change, published by nobody.
#
# A wheel that only exists at release time is a wheel first built under
# time pressure, and a binding is exactly where a build breaks per
# platform: the interpreter, the ABI and the linker all differ. So the
# matrix runs continuously and the artefacts are kept, and publishing
# stays a separate deliberate act — `pip install` is not something to
# start offering as a side effect of a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, rather than the first failure cancelling
      # the rest. A binding that builds on Linux and not macOS is a fact
      # worth having in one run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # abi3 means one wheel serves every interpreter from the minimum
      # forward, so the matrix is over platforms rather than over Python
      # versions — four wheels instead of twenty.
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/oq-py
          args: --release --out dist
          manylinux: auto
      - name: The wheel must import and answer
        # Building is not evidence. A wheel that installs and cannot
        # compute is a wheel that passed CI and fails for the first user,
        # and the failure would be an ABI or linkage problem — exactly
        # what a per-platform matrix exists to catch.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links crates/oq-py/dist --no-index openquanter
          python - <<'PY'
          import openquanter as oq
          returns = [0.01 * ((i % 7) - 3) for i in range(200)]
          s = oq.sharpe_ratio(returns)
          assert isinstance(s, float) and s == s, s
          sharpes = [0.05 + 0.013 * i for i in range(20)]
          d = oq.deflated_sharpe_ratio(sharpes, 100, 0.0, 3.0)
          assert 0.0 <= d <= 1.0, d
          # The refusals have to survive the boundary too: an exception
          # that arrives as a panic rather than a ValueError would abort
          # the interpreter instead of being catchable.
          try:
              oq.deflated_sharpe_ratio([1.5], 100, 0.0, 3.0)
          except ValueError as e:
              assert "no search to deflate" in str(e), e
          else:
              raise AssertionError("a search of one must be refused")
          print("wheel imports and computes:", s, d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: crates/oq-py/dist/*.whl
