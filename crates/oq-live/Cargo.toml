[package]
name = "oq-live"
version.workspace = true
description = "Live process assembly for the OpenQuanter trading framework: startup reconciliation, stream supervision, and the only path that can send an order"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oq-core.workspace = true
oq-engine.workspace = true
oq-margin.workspace = true
oq-gateway.workspace = true
oq-ingest.workspace = true
oq-journal.workspace = true
oq-l2feed.workspace = true
oq-parity.workspace = true
oq-risk.workspace = true
oq-strategy.workspace = true
oq-types.workspace = true

[dev-dependencies]
# The teaching strategies, for `examples/grid_live.rs`. A **dev**
# dependency and not a real one: `oq-examples` is `publish = false`, so a
# published crate cannot depend on it — and nothing that links `oq-live`
# should inherit a catalogue of teaching material either.
oq-examples = { path = "../oq-examples" }
oq-sim.workspace = true

[lints]
workspace = true
