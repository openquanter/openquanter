[package]
name = "oq-l2feed"
version.workspace = true
description = "Market data capture for the OpenQuanter trading framework: verbatim record framing, UTC-day rotation, sealing and manifests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oq-hash.workspace = true
oq-types.workspace = true
ruzstd = "0.8.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = "3.4"
# For SIGTERM only. std has no signal API, and a capture that cannot
# notice a termination request loses its in-flight buffer and writes no
# manifest. Already present transitively, so this adds no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tungstenite = { version = "0.30", default-features = false }

[lints]
workspace = true
