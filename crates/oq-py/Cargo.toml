[package]
name = "oq-py"
version.workspace = true
description = "Python bindings for OpenQuanter's overfitting statistics, so a Python user can evaluate the backtest they already have"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "oq_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
oq-backtest.workspace = true
oq-engine.workspace = true
oq-margin.workspace = true
oq-stats.workspace = true
oq-strategy.workspace = true
oq-types.workspace = true
# `extension-module` is deliberately NOT a default feature. With it on, the
# library does not link libpython — correct for a wheel, and it makes a
# plain `cargo build` fail to link on macOS. maturin turns it on (see
# pyproject.toml); `cargo build` and `cargo test` link against the
# interpreter and work anywhere, which is what keeps this crate testable
# without a wheel toolchain.
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[features]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
