[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "openquanter"
description = "Python bindings for OpenQuanter: run a strategy on the Rust engine, and evaluate the backtest you already have"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "OpenQuanter" }]
keywords = ["trading", "quant", "backtesting", "overfitting", "sharpe", "margin", "liquidation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/openquanter/openquanter"
Repository = "https://github.com/openquanter/openquanter"

[tool.maturin]
module-name = "openquanter"
features = ["extension-module"]
