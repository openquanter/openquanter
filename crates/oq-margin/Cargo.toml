[package]
name = "oq-margin"
version.workspace = true
description = "Tiered maintenance margin, liquidation pricing, and funding for the OpenQuanter trading framework"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oq-types.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Generated inputs, for the invariants FR-MARGIN-7 names. A
# dev-dependency: nothing that depends on this crate inherits it, and the
# budget this workspace defends is what a *consumer* pulls in — the same
# reasoning that puts `criterion` behind `cargo bench` in oq-examples.
proptest = { version = "1", default-features = false, features = ["std"] }
