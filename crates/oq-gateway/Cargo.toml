[package]
name = "oq-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Venue adapter: account access and reconciliation. Read-only for now."

[dependencies]
oq-hash.workspace = true
oq-types.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = "3.4"
# Ed25519, for the one venue that signs with a keypair rather than a
# shared secret. Taken rather than written: a hash is deterministic bit
# arithmetic with published vectors, and curve arithmetic is
# constant-time field math where a mistake leaks the key. See
# docs/VENUES.md for the decision and scripts/check-composability.sh for
# what it cost.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
# secp256k1 and Keccak-256, for the venue that signs EIP-712 typed data
# with a wallet key. Same reasoning as above, and the same line: the
# signature is verifiable against the venue's own published vectors, the
# curve arithmetic under it is not something to hand-write.
k256 = { version = "0.13", default-features = false, features = ["std", "ecdsa"] }
sha3 = { version = "0.10", default-features = false, features = ["std"] }

[lints]
workspace = true
